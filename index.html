      <!-- Affiliate helper: ensure Amazon links include the affiliate tracking tag for source attribution -->
      <script>
        (function(){
          const AFFILIATE_TAG = 'irha0cd-21';
          document.addEventListener('click', function(e){
            const a = e.target.closest && e.target.closest('a[href]');
            if(!a) return;
            try{
              const href = a.getAttribute('href');
              if(!href) return;
              // Only modify amazon links (also handles regional domains like amazon.in, amazon.com)
              if(/amazon\./i.test(href) || /amzn\.to/i.test(href)){
                // if tag already present, do nothing
                if(/([?&])tag=/i.test(href)) return;
                e.preventDefault();
                const sep = href.indexOf('?') === -1 ? '?' : '&';
                const newUrl = href + sep + 'tag=' + AFFILIATE_TAG;
                // If link opens in new tab, use window.open with noopener
                if(a.target === '_blank') window.open(newUrl, '_blank', 'noopener');
                else window.location.href = newUrl;
              }
            }catch(err){
              // fail silently
              console.error(err);
            }
          }, false);
        })();
      </script>
