<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irha Finds Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2a5298;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-card h2 {
      font-size: 18px;
      margin: 10px 0;
    }

    .product-card p {
      font-size: 14px;
      color: #555;
    }

    .btn-group {
      margin-top: 12px;
    }

    .btn {
      display: inline-block;
      padding: 8px 14px;
      margin: 5px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      font-size: 14px;
    }

    .amazon {
      background: #2a5298;
    }

    .whatsapp {
      background: #25D366;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>Irha Finds Store</h1>
  <p>Premium Products for Modern Lifestyle</p>
</header>

<section class="product-container">

  <!-- Product Example -->
  <div class="product-card">
    <img src="iphone charger.jpg">
    <h2>iPhone 20W Fast Charger</h2>
    <p>Fast PD charging for iPhones.</p>

    <div class="btn-group">
      <a class="btn amazon" href="https://amzn.to/4vytVm0" target="_blank">Amazon</a>

      <a class="btn whatsapp" 
         href="https://wa.me/916305675227?text=Hi,%20I%20want%20to%20buy%20iPhone%2020W%20Fast%20Charger"
         target="_blank">
         WhatsApp
      </a>
    </div>
  </div>

  <!-- Duplicate this block for other products -->

  <div class="product-card">
    <img src="MAGICMOB.jpg">
    <h2>Magic Bathroom Broom</h2>
    <p>180° rotating cleaning broom.</p>

    <div class="btn-group">
      <a class="btn amazon" href="https://amzn.to/4ckxeEn" target="_blank">Amazon</a>

      <a class="btn whatsapp" 
         href="https://wa.me/916305675227?text=Hi,%20I%20want%20to%20buy%20Magic%20Bathroom%20Broom"
         target="_blank">
         WhatsApp
      </a>
    </div>
  </div>

</section>

<footer>
  📞 WhatsApp Orders: +91 6305675227 <br>
  © 2026 Irha Finds Store
</footer>

</body>
</html>
